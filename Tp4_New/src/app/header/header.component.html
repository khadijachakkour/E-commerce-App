<div class="container">
  <div class="row align-items-center">
    <div class="col-md-6">
      <nav class="navbar navbar-expand-md navbar-light">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" routerLink="/home" routerLinkActive="active" i18n>
              <i class="fas fa-home"></i> Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/catalogNv" routerLinkActive="active" i18n>
              <i class="fas fa-list"></i> Catalog
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <div class="col-md-6">
      <div class="d-flex justify-content-end">
        <div class="user-section">
          <!-- Non-authenticated users -->
          <div class="right" *ngIf="!user">
            <a routerLink="/signin" routerLinkActive="active" class="btn btn-outline-primary" i18n>Sign In</a>
            <a routerLink="/signUp" routerLinkActive="active" class="btn btn-primary cta" i18n>Sign Up</a>
          </div>

          <!-- Authenticated users -->
          <div class="right" *ngIf="user">
            <!-- Common options for all authenticated users -->
            <img src="/assets/images/profile.png" (click)="toggleSignOutMenu()" alt="profile" class="profile" i18n-alt/>
            <div class="sign-out" *ngIf="showSignOutMenu">
              <button (click)="signOut()" i18n>Sign Out</button>
            </div>

            <!-- Client specific options -->
            <a routerLink="/cart" routerLinkActive="active" class="btn btn-link cart-icon" *ngIf="user?.role === 'client'">
              <i class="fas fa-shopping-cart"></i>
            </a>

            <div *ngIf="user?.role === 'admin'" class="dropdown">
              <button class="btn btn-primary dropdown-toggle" type="button" id="manageProductsDropdown" data-bs-toggle="dropdown" aria-expanded="false" i18n>
                Manage Products
              </button>
              <ul class="dropdown-menu" aria-labelledby="manageProductsDropdown">
                <li><a class="dropdown-item" routerLink="/manage-products/read" i18n>View Products</a></li>
                <li><a class="dropdown-item" routerLink="/manage-products/add" i18n>Add Product</a></li>
              </ul>
              <button class="btn btn-primary dropdown-toggle" type="button" id="manageProductsDropdown" data-bs-toggle="dropdown" aria-expanded="false" i18n>
                Manage Users
              </button>
              <ul class="dropdown-menu" aria-labelledby="manageProductsDropdown">
                <li><a class="dropdown-item" routerLink="/manage-users/read" i18n>View Users</a></li>
                <li><a class="dropdown-item" routerLink="/manage-users/add" i18n>Add User</a></li>
              </ul>
            </div>
            <button routerLink="/profile" routerLinkActive="active" class="btn btn-primary" i18n>Profile</button>
          </div>
        </div>
        </div>
      </div>
    </div>

  </div>
