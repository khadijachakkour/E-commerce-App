<div class="container">
  <div class="row">
    <div class="col-md-6">
      <form #signInForm="ngForm" class="form" (ngSubmit)="signIn()">
        <div class="sign-in" i18n>Sign In</div>
        <div class="sub-text" i18n>To discover more...</div>
        <div class="input-group">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          </div>
          <input name="email" required email #email="ngModel" [(ngModel)]="credentials.email" placeholder="Email Address"
            type="email" class="form-control" i18n-placeholder>
        </div>
        <em class="error" *ngIf="email.errors?.['required'] && email.touched" i18n>Email is required</em>
        <em class="error" *ngIf="email.errors?.['email'] && email.touched" i18n>Must be a valid email format</em>
        <div class="input-group">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
          </div>
          <input name="password" required #password="ngModel" [(ngModel)]="credentials.password" placeholder="Password"
            type="password" class="form-control" i18n-placeholder/>
        </div>
        <em class="error" *ngIf="password.invalid && password.touched" i18n>Password is required</em>
        <div class="buttons">
          <button type="submit" [disabled]="signInForm.form.invalid" class="button cta" i18n>
            Sign In
          </button>
        </div>
        <div class="form-group" i18n>
          <p class="text-muted">Don't have an account yet ? <a href="/signUp">Sign Up</a></p>
        </div>
        <div class="signInError" *ngIf="signInError" i18n>
          Sign In Error !!. Please try again.
        </div>
      </form>
    </div>
    <div class="col-md-6">
      <div class="logo-container">
        <img src="/assets/images/Logo.jpg" alt="Logo" class="logo" i18n-alt>
      </div>
    </div>
  </div>
</div>
